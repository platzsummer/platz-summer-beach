<title>Platz Summer Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D beach, quiet glass chips floating at the edges, one intro veil */
:root{
  --ink:#1c2a33; --ink-soft:#4a5a63;
  --glass:rgba(255,248,238,.78); --glass-line:rgba(28,42,51,.12);
  --veil:#13252f; --veil-ink:#f6e7cf; --veil-soft:#c9b79c;
  --sun:#ef8a5b; --sea:#2f7f8f;
  --display:"Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--veil);color:var(--ink);font-family:var(--body)}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

.chip{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;font-size:13px;line-height:1.2;white-space:nowrap}
button.chip:hover{background:rgba(255,252,246,.95)}

.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:16px;padding:6px 14px 6px 8px}
.brand svg{width:26px;height:26px}
.right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.where{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(76px + env(safe-area-inset-top,0px));font-size:12px;letter-spacing:.04em}
.caption{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(78vw,420px);text-align:center;white-space:normal;font-size:13.5px;transition:opacity .4s}

.zones{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.zones button{pointer-events:auto;font-size:12.5px}
.zones button[aria-current="true"]{background:var(--ink);color:#fbf1e2;border-color:var(--ink)}
.zones button span{font-variant-numeric:tabular-nums;opacity:.6;margin-right:4px}
.hint{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);text-align:center;width:max-content;max-width:90vw;white-space:normal;transition:opacity 1s}

.ride{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#8b5cf6;color:#fff;border-color:#8b5cf6;font-size:15px;font-weight:600;padding:13px 28px;box-shadow:0 6px 20px rgba(60,30,120,.3)}
button.ride:hover{background:#7c4ae8}
.order{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3e7d4a;color:#fff;border-color:#3e7d4a;font-size:15px;font-weight:600;padding:13px 28px;box-shadow:0 6px 20px rgba(30,70,30,.3)}
button.order:hover{background:#346a3e}
.shedPanel{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:10px 12px}
.shedPanel[hidden]{display:none}
.people{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.people[hidden]{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:#2fb36a;box-shadow:0 0 0 3px rgba(47,179,106,.18);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(47,179,106,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.swatches{display:flex;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--glass-line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.waxBtn{background:var(--ink);color:#fbf1e2;border-color:var(--ink);font-weight:600}
.waxBtn:disabled{opacity:.55;cursor:default}
/* intro veil */
.veil{position:fixed;inset:0;background:var(--veil);color:var(--veil-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));transition:opacity .9s ease}
.veil.gone{opacity:0;pointer-events:none}
.veil svg{width:76px;height:76px}
.veil h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,40px);letter-spacing:.18em;margin:6px 0 0;text-wrap:balance}
.veil .sub{font-size:12px;letter-spacing:.42em;color:var(--veil-soft);margin:0}
.veil .tag{font-size:14px;margin:12px 0 4px}
.enter{border:1px solid rgba(246,231,207,.5);background:transparent;border-radius:999px;padding:12px 30px;min-width:200px;display:flex;justify-content:space-between;gap:24px;font-size:14px}
.enter:hover{background:rgba(246,231,207,.08)}
.path{font-size:11.5px;color:var(--veil-soft);letter-spacing:.02em}
.foot{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-family:var(--display);font-style:italic;font-size:13px;color:var(--veil-soft)}
@media (max-width:520px){ .where{top:calc(116px + env(safe-area-inset-top,0px))} .caption{top:calc(156px + env(safe-area-inset-top,0px))} .brand span{display:none} .brand{padding:6px 8px} }
@media (prefers-reduced-motion:reduce){ .veil,.caption,.hint{transition:none} }
</style>

<canvas id="scene" aria-label="걸어다닐 수 있는 3D 서핑 해변"></canvas>

<div class="top">
  <div class="chip brand" aria-label="Platz Summer">
    <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="20" cy="18" r="7"/><path d="M20 5v3M9 9l2 2M31 9l-2 2M5 18h3M32 18h3"/><path d="M4 28c3-2.5 6-2.5 9 0s6 2.5 9 0 6-2.5 9 0 4 1.6 5 1"/><path d="M8 33c3-2 6-2 9 0s6 2 9 0 6-2 8 0"/></svg>
    <span>Platz Summer</span>
  </div>
  <div class="right">
    <div class="chip people" id="people" hidden><i class="dot"></i>1명 접속 중</div>
    <button class="chip" id="weatherBtn" type="button">☀ 맑음</button>
    <button class="chip" id="timeBtn" type="button">발리</button>
    <button class="chip" id="musicBtn" type="button">☾ 명상 음악 켜기</button>
    <button class="chip" id="soundBtn" type="button">♬ 파도 소리 켜기</button>
  </div>
</div>
<div class="chip where" id="where">1 · 스미냑 게이트</div>
<div class="chip caption" id="caption">맨발로 걸어 들어오세요.</div>
<div class="hint" id="hint">화면을 탭하면 그곳으로 걸어가요 · 드래그해서 둘러보기 · WASD / 방향키</div>
<div class="shedPanel" id="shedPanel" hidden><div class="swatches" id="swatches" role="group" aria-label="보드 고르기"></div><button class="chip waxBtn" id="waxBtn" type="button">왁스 칠하기</button></div>
<nav class="zones" id="zones" aria-label="장소로 이동"></nav>
<button class="chip order" id="orderBtn" type="button" hidden>코코넛 주문하기 ↗</button>
<button class="chip ride" id="rideBtn" type="button" hidden>파도 타기 ↗</button>

<div class="veil" id="veil">
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="20" cy="18" r="7"/><path d="M20 5v3M9 9l2 2M31 9l-2 2M5 18h3M32 18h3"/><path d="M4 28c3-2.5 6-2.5 9 0s6 2.5 9 0 6-2.5 9 0 4 1.6 5 1"/><path d="M8 33c3-2 6-2 9 0s6 2 9 0 6-2 8 0"/></svg>
  <h1>플라츠썸머</h1>
  <p class="sub">스미냑 비치 · 서프 · 명상</p>
  <p class="tag">파도 한 판 타고 나와서, 사롱 위에서 숨 고르기.</p>
  <button class="enter" id="enter" type="button"><span>들어가기</span><span>↗</span></button>
  <p class="path">스미냑 게이트 → 코코넛 와룽 → 서프 셰드 → 파도 앞 → 라인업 → 플라츠썸머 사롱에서 명상</p>
  <p class="foot">Seminyak, Bali · 8°41′S</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T = THREE;
const canvas = document.getElementById('scene');
const renderer = new T.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding;

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(55, 1, 0.1, 700);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- palettes ---------- */
const PRESETS = {
  sunset:{ top:'#28365f', mid:'#d9786a', low:'#ffcb8c', fog:'#eea07c', sun:'#ffd2a1', sunPos:[-40,16,-220], light:'#ffb889', lightI:1.05, hemiSky:'#ffd1a8', hemiGround:'#5b4a5c', hemiI:.75,
           deep:'#1d4a66', shallow:'#3f8f9d', foam:'#fff1df', sand:'#e6c294', wet:'#b8916a' },
  night: { top:'#0a1430', mid:'#1b2850', low:'#34446c', fog:'#1a2544', sun:'#f4f1e2', sunPos:[-70,70,-220], light:'#a8bce0', lightI:.42, hemiSky:'#7d8fb8', hemiGround:'#2a2a38', hemiI:.42,
           deep:'#0e283c', shallow:'#1d4b59', foam:'#c8d5e2', sand:'#a39581', wet:'#76695a' },
  day:   { top:'#3c9ad6', mid:'#8fd0ea', low:'#e4f6f7', fog:'#c6e6ee', sun:'#fffbe8', sunPos:[50,120,-220], light:'#fff6e4', lightI:1.25, hemiSky:'#d9f0ff', hemiGround:'#c8a77c', hemiI:.85,
           deep:'#156a8f', shallow:'#46bfc0', foam:'#ffffff', sand:'#f2dcae', wet:'#c9a97b' }
};
let P = PRESETS.sunset;

const skyCanvas = document.createElement('canvas'); skyCanvas.width=4; skyCanvas.height=256;
const skyTex = new T.CanvasTexture(skyCanvas); skyTex.encoding = T.sRGBEncoding;
scene.background = skyTex;
scene.fog = new T.Fog(P.fog, 60, 260);

const hemi = new T.HemisphereLight(P.hemiSky, P.hemiGround, P.hemiI); scene.add(hemi);
const sunLight = new T.DirectionalLight(P.light, P.lightI);
sunLight.castShadow = true; sunLight.shadow.mapSize.set(2048,2048);
Object.assign(sunLight.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:200});
scene.add(sunLight, sunLight.target);

const sunDisc = new T.Mesh(new T.SphereGeometry(10,32,16), new T.MeshBasicMaterial({color:P.sun, fog:false}));
scene.add(sunDisc);

const C = (h)=>new T.Color(h);
let colDeep, colShallow, colFoam;
let curPreset='';
function applyPreset(name){
  curPreset=name;
  P = PRESETS[name];
  const g = skyCanvas.getContext('2d'); const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,P.top); gr.addColorStop(.62,P.mid); gr.addColorStop(1,P.low);
  g.fillStyle=gr; g.fillRect(0,0,4,256); skyTex.needsUpdate=true;
  scene.fog.color.set(P.fog);
  hemi.color.set(P.hemiSky); hemi.groundColor.set(P.hemiGround); hemi.intensity=P.hemiI;
  sunLight.color.set(P.light); sunLight.intensity=P.lightI;
  sunDisc.material.color.set(P.sun); sunDisc.position.set(...P.sunPos);
  colDeep=C(P.deep); colShallow=C(P.shallow); colFoam=C(P.foam);
  if (sandMesh) paintSand();
  applyWeather();
}

/* ---------- terrain ---------- */
const MEDI_PAD={x:-20, z:30.7, y:0.12};
function sandY(x,z){
  let y = z > 2 ? 0.05 + 0.05*Math.sin(x*0.29)*Math.sin(z*0.23) + Math.max(0,(z-30))*0.03 : 0.05 + (z-2)*0.13;
  // a flat, smoothed pad of sand for the meditation sarongs
  const d=Math.hypot(x-MEDI_PAD.x, z-MEDI_PAD.z);
  if(d<11){ const k=Math.min(1,Math.max(0,(d-7)/4)), s=k*k*(3-2*k); y = MEDI_PAD.y*(1-s) + y*s; }
  return y;
}
let sandMesh;
const sandGeo = new T.PlaneGeometry(200, 80, 100, 40);
sandGeo.rotateX(-Math.PI/2); sandGeo.translate(0,0,30);
{ const p=sandGeo.attributes.position; for(let i=0;i<p.count;i++){ p.setY(i, sandY(p.getX(i),p.getZ(i))); } sandGeo.computeVertexNormals();
  sandGeo.setAttribute('color', new T.BufferAttribute(new Float32Array(p.count*3),3)); }
function paintSand(){
  const p=sandGeo.attributes.position, c=sandGeo.attributes.color, dry=C(P.sand), wet=C(P.wet), tmp=new T.Color();
  for(let i=0;i<p.count;i++){ const z=p.getZ(i), x=p.getX(i);
    const k = Math.min(1, Math.max(0,(z-1)/4)); tmp.copy(wet).lerp(dry,k);
    const n = (Math.sin(x*1.7+z*2.3)*0.5+0.5)*0.04; tmp.offsetHSL(0,0,n-0.02);
    c.setXYZ(i,tmp.r,tmp.g,tmp.b); }
  c.needsUpdate=true;
}
sandMesh = new T.Mesh(sandGeo, new T.MeshStandardMaterial({vertexColors:true, roughness:1, flatShading:true}));
sandMesh.receiveShadow = true; scene.add(sandMesh);

/* ---------- ocean ---------- */
function waveH(x,z,t){
  let h = 0.5*Math.sin(z*0.34 - t*1.25 + Math.sin(x*0.045)*1.3);
  h += 0.18*Math.sin(x*0.17 + z*0.09 + t*0.7);
  h += 0.07*Math.sin(x*0.6 - z*0.4 + t*2.1);
  const fade = Math.min(1, Math.max(0.12, (-z)/20));
  return h*fade - 0.05;
}
const oceanGeo = new T.PlaneGeometry(300, 200, 100, 70);
oceanGeo.rotateX(-Math.PI/2); oceanGeo.translate(0,0,-97);
oceanGeo.setAttribute('color', new T.BufferAttribute(new Float32Array(oceanGeo.attributes.position.count*3),3));
const oceanBase = Float32Array.from(oceanGeo.attributes.position.array);
const ocean = new T.Mesh(oceanGeo, new T.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:.3, metalness:.15, transparent:true, opacity:.94}));
ocean.receiveShadow = true; scene.add(ocean);
const tmpC = new T.Color();
function updateOcean(t){
  const p=oceanGeo.attributes.position, c=oceanGeo.attributes.color;
  for(let i=0;i<p.count;i++){
    const x=oceanBase[i*3], z=oceanBase[i*3+2];
    const h=waveH(x,z,t); p.setY(i,h);
    const depth=Math.min(1, Math.max(0,(-z)/45));
    tmpC.copy(colShallow).lerp(colDeep, depth);
    const crest = (h - 0.25*Math.min(1,(-z)/20)) ;
    if (crest > 0.02 && z > -48) tmpC.lerp(colFoam, Math.min(.9, crest*3));
    c.setXYZ(i,tmpC.r,tmpC.g,tmpC.b);
  }
  p.needsUpdate=true; c.needsUpdate=true; oceanGeo.computeVertexNormals();
}
// shore wash
const wash = new T.Mesh(new T.PlaneGeometry(200, 1.6, 80, 1), new T.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.55}));
wash.rotation.x=-Math.PI/2; scene.add(wash);

/* ---------- props ---------- */
const mat = (color, o={}) => new T.MeshStandardMaterial(Object.assign({color, roughness:.85, flatShading:true}, o));
function shadowed(m){ m.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } }); return m; }

function palm(x,z,h=7,lean=0.6,rot=0){
  const g=new T.Group();
  const pts=[]; for(let i=0;i<=6;i++){ const k=i/6; pts.push(new T.Vector3(Math.sin(k*1.4)*lean*h*0.35, k*h, 0)); }
  const curve=new T.CatmullRomCurve3(pts);
  const trunk=new T.Mesh(new T.TubeGeometry(curve, 12, 0.22, 6, false), mat('#8a6a4a'));
  g.add(trunk);
  const top=pts[6];
  const leafMat=mat('#3f7a4a',{side:T.DoubleSide});
  for(let i=0;i<8;i++){
    const leaf=new T.Mesh(new T.ConeGeometry(0.55, 4.2, 4, 1, true), leafMat);
    leaf.scale.set(1,1,0.18); leaf.geometry.translate(0,2.1,0);
    const pivot=new T.Group(); pivot.position.copy(top); pivot.rotation.y=i/8*Math.PI*2 + Math.random()*.3;
    leaf.rotation.z = -(1.15 + Math.random()*0.35); pivot.add(leaf); g.add(pivot);
  }
  for(let i=0;i<3;i++){ const c=new T.Mesh(new T.SphereGeometry(0.22,6,5), mat('#6b4a2b')); c.position.copy(top).add(new T.Vector3(Math.cos(i*2)*.3,-.3,Math.sin(i*2)*.3)); g.add(c); }
  g.position.set(x, sandY(x,z), z); g.rotation.y=rot; scene.add(shadowed(g)); return g;
}
[[-18,14,8,.7,.4],[-24,22,7,.5,1.2],[22,26,7.5,.6,2.6],[28,10,8.5,.8,-.6],[-6,30,6.5,.4,2],[34,20,7,.5,3.4],[-34,10,8,.7,.2],[-14,40,7,.6,1.1],[-40,26,7.5,.5,.9],[44,6,8,.7,-1]]
  .forEach(a=>palm(...a));
// extra palm grove behind the beach and along both sides
{
  const keepClear=[[12,14,7],[-20,30,8],[0,34,4],[0,40,3],[8,39,6],[-6.5,41.2,6]];
  const ok=(x,z)=>keepClear.every(([cx,cz,r])=>Math.hypot(x-cx,z-cz)>r) && Math.abs(x)>2.5;
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  let n=0, tries=0;
  while(n<23 && tries<600){ tries++;
    const band=rnd();
    let x,z;
    if(band<.6){ x=-80+rnd()*160; z=36+rnd()*30; }          // grove behind the sand
    else { x=(rnd()<.5?-1:1)*(42+rnd()*40); z=4+rnd()*36; }  // headlands to the sides
    if(!ok(x,z)) continue;
    palm(x,z,6+rnd()*4.5,.3+rnd()*.7,rnd()*Math.PI*2); n++;
  }
  // a few low bushes to fill the gaps
  for(let i=0;i<0;i++){ const x=-70+rnd()*140, z=40+rnd()*24; if(!ok(x,z)) continue;
    const b=new T.Mesh(new T.IcosahedronGeometry(.9+rnd()*1.2,0), mat(rnd()<.5?'#4c7a45':'#5d8a4a')); b.scale.y=.6; b.position.set(x,sandY(x,z)+.3,z); scene.add(shadowed(b)); }
}

function boardMesh(color, stripe){
  const g=new T.Group();
  const b=new T.Mesh(new T.SphereGeometry(1,20,10), mat(color,{roughness:.5,flatShading:false}));
  b.scale.set(0.32, 0.06, 1.35); g.add(b);
  if(stripe){ const s=new T.Mesh(new T.BoxGeometry(0.05,0.13,2.2), mat(stripe)); g.add(s); }
  return g;
}

// surf shed
const shed=new T.Group();
const wood=mat('#a4774f'), dark=mat('#6e4d33');
const deck=new T.Mesh(new T.BoxGeometry(9,0.3,6), dark); deck.position.y=0.5; shed.add(deck);
[[-4,-2.7],[4,-2.7],[-4,2.7],[4,2.7]].forEach(([x,z])=>{ const post=new T.Mesh(new T.CylinderGeometry(.14,.16,4.2,6), wood); post.position.set(x,2.6,z); shed.add(post); });
const roof=new T.Mesh(new T.ConeGeometry(7, 2.6, 4), mat('#c9a463')); roof.rotation.y=Math.PI/4; roof.scale.set(1,1,.78); roof.position.y=5.9; shed.add(roof);
const back=new T.Mesh(new T.BoxGeometry(9,3.2,0.2), wood); back.position.set(0,2.2,2.8); shed.add(back);
const counter=new T.Mesh(new T.BoxGeometry(4,1.1,1), dark); counter.position.set(1.5,1.2,1.4); shed.add(counter);
const waxOnCounter=new T.Mesh(new T.BoxGeometry(.3,.12,.2), new T.MeshStandardMaterial({color:'#f4ead2', roughness:.6})); waxOnCounter.position.set(1.0,1.81,1.4); shed.add(waxOnCounter);

// rainbow umbrellas and bean bags in a long row, Kuta sunset style
function rainbowUmbrella(x,z){
  const g=new T.Group();
  const pole=new T.Mesh(new T.CylinderGeometry(.05,.05,2.7,6), mat('#efe6d6')); pole.position.y=1.35; g.add(pole);
  const cone=new T.ConeGeometry(1.7,.65,10,1,true).toNonIndexed();
  const cols=['#e5483d','#f39a3a','#f5d34a','#5fb85a','#3f8fd2','#8b5cf6','#e5483d','#f39a3a','#f5d34a','#3f8fd2'].map(c=>new T.Color(c));
  const pp=cone.attributes.position, carr=new Float32Array(pp.count*3);
  for(let i=0;i<pp.count;i+=3){ const cx=(pp.getX(i)+pp.getX(i+1)+pp.getX(i+2))/3, cz=(pp.getZ(i)+pp.getZ(i+1)+pp.getZ(i+2))/3;
    const seg=Math.floor(((Math.atan2(cz,cx)+Math.PI)/(Math.PI*2))*10)%10; for(let j=0;j<3;j++){ carr[(i+j)*3]=cols[seg].r; carr[(i+j)*3+1]=cols[seg].g; carr[(i+j)*3+2]=cols[seg].b; } }
  cone.setAttribute('color', new T.BufferAttribute(carr,3));
  const top=new T.Mesh(cone, new T.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:.8, side:T.DoubleSide})); top.position.y=2.7; g.add(top);
  [['#f39a3a',-.9],['#3f8fd2',.9]].forEach(([c,dx])=>{ const bag=new T.Mesh(new T.SphereGeometry(.55,16,12), mat(c,{flatShading:false})); bag.scale.set(1,.55,1.15); bag.position.set(dx,.28,-.5); g.add(bag); });
  g.position.set(x, sandY(x,z), z); g.rotation.y=(Math.random()-.5)*.3; scene.add(shadowed(g));
}

/* ---------- a big frangipani (jepun) tree by the gate ---------- */
{
  const FX=-6.5, FZ=41.2, base=sandY(FX,FZ);
  let sd=21; const r=()=>{ sd=(sd*9301+49297)%233280; return sd/233280; };
  const bark=new T.MeshStandardMaterial({color:'#8d8378', roughness:.85});
  const leafM=new T.MeshStandardMaterial({color:'#3f6b3a', roughness:.7});
  const petalM=new T.MeshStandardMaterial({color:'#fbf6ec', roughness:.55});
  const heartM=new T.MeshStandardMaterial({color:'#f6c94a', roughness:.6});
  const tree=new T.Group(); tree.position.set(FX,base,FZ); scene.add(tree);
  function limb(from, dir, len, rad){
    const mid=from.clone().addScaledVector(dir,len*.5).add(new T.Vector3((r()-.5)*.25,0,(r()-.5)*.25));
    const end=from.clone().addScaledVector(dir,len);
    const curve=new T.CatmullRomCurve3([from,mid,end]);
    const tube=new T.TubeGeometry(curve,16,rad,10,false);
    const pp=tube.attributes.position; // taper toward the end
    for(let i=0;i<pp.count;i++){ const seg=Math.floor(i/11)/16, c=curve.getPoint(seg), k=1-seg*.35; pp.setXYZ(i, c.x+(pp.getX(i)-c.x)*k, pp.getY(i), c.z+(pp.getZ(i)-c.z)*k); }
    tube.computeVertexNormals(); tree.add(new T.Mesh(tube,bark));
    const knob=new T.Mesh(new T.SphereGeometry(rad*.68,12,10),bark); knob.position.copy(end); tree.add(knob);
    return end;
  }
  function flower(at, rot){
    const f=new T.Group(); f.position.copy(at); f.rotation.set(rot.x,rot.y,rot.z);
    for(let i=0;i<5;i++){ const pv=new T.Group(); pv.rotation.y=i/5*Math.PI*2; const pe=new T.Mesh(new T.SphereGeometry(1,16,10),petalM); pe.scale.set(.13,.026,.072); pe.position.set(.105,0,0); pe.rotation.y=-.35; pv.add(pe); f.add(pv); }
    const h=new T.Mesh(new T.SphereGeometry(.045,12,8),heartM); h.scale.y=.6; h.position.y=.012; f.add(h);
    tree.add(f); return f;
  }
  function crown(tip){
    for(let i=0;i<6;i++){ const pv=new T.Group(); pv.position.copy(tip); pv.rotation.y=i/6*Math.PI*2+r()*.4;
      const lf=new T.Mesh(new T.SphereGeometry(1,16,10),leafM); lf.scale.set(.15,.03,.55); lf.position.set(0,0,.5); lf.rotation.x=-.25; pv.rotation.x=0; const tilt=new T.Group(); tilt.rotation.x=-.28; tilt.add(lf); pv.add(tilt); tree.add(pv); }
    const n=4+Math.floor(r()*2);
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+r(); flower(tip.clone().add(new T.Vector3(Math.cos(a)*.17,.3+r()*.07,Math.sin(a)*.17)), new T.Euler(Math.cos(a)*.5,0,Math.sin(a)*.5)); }
  }
  const trunkTop=limb(new T.Vector3(0,0,0), new T.Vector3(.12,1,.05).normalize(), 2.3, .3);
  for(let i=0;i<3;i++){
    const a=i/3*Math.PI*2+.4, d1=new T.Vector3(Math.cos(a)*.75,1,Math.sin(a)*.75).normalize();
    const e1=limb(trunkTop, d1, 1.7+r()*.4, .18);
    const forks=i===1?3:2;
    for(let j=0;j<forks;j++){
      const b=a+(j-(forks-1)/2)*.9, d2=new T.Vector3(Math.cos(b)*.7,1,Math.sin(b)*.7).normalize();
      const e2=limb(e1, d2, 1.1+r()*.5, .1);
      crown(e2);
    }
  }
  tree.scale.setScalar(1.6); shadowed(tree);
  // a few blossoms fallen on the sand
  for(let i=0;i<6;i++){ const a=r()*Math.PI*2, d=1.2+r()*2.6; const x=Math.cos(a)*d, z=Math.sin(a)*d;
    flower(new T.Vector3(x, sandY(FX+x,FZ+z)-base+.02, z), new T.Euler(0, r()*6, 0)); }
}

/* ---------- yoga: sarongs laid on the sand ---------- */
function sarongTex(base, ink, accent, kind){
  const c=document.createElement('canvas'); c.width=256; c.height=512; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,256,512);
  // border bands
  g.fillStyle=accent; g.fillRect(0,0,256,26); g.fillRect(0,486,256,26);
  g.fillStyle=ink; for(let x=0;x<256;x+=16){ g.beginPath(); g.arc(x+8,13,4,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(x+8,499,4,0,Math.PI*2); g.fill(); }
  // fringe
  g.strokeStyle=accent; g.lineWidth=2; for(let x=4;x<256;x+=8){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,0); g.stroke(); }
  g.strokeStyle=ink; g.fillStyle=ink; g.lineWidth=3;
  for(let y=50;y<480;y+=56){ for(let x=22;x<256;x+=52){
    const ox = ((y/56)%2)*26;
    const cx=x+ox-13, cy=y+10;
    if(kind==='flower'){ for(let k=0;k<6;k++){ g.beginPath(); g.ellipse(cx+Math.cos(k)*9,cy+Math.sin(k)*9,7,3.5,k,0,Math.PI*2); g.stroke(); } g.beginPath(); g.arc(cx,cy,3,0,Math.PI*2); g.fill(); }
    else if(kind==='wave'){ g.beginPath(); g.arc(cx,cy,14,Math.PI,0); g.stroke(); g.beginPath(); g.arc(cx,cy,7,Math.PI,0); g.stroke(); }
    else { g.beginPath(); g.moveTo(cx,cy-14); g.quadraticCurveTo(cx+12,cy,cx,cy+14); g.quadraticCurveTo(cx-12,cy,cx,cy-14); g.stroke(); g.beginPath(); g.moveTo(cx,cy-12); g.lineTo(cx,cy+12); g.stroke(); }
  }}
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=4; return t;
}

const SARONGS=[
  ['#c4542f','#f3e2c4','#2a1d16','flower'],
  ['#2f6f7f','#f2e6cf','#e2a14f','wave'],
  ['#e8b65a','#6b3a22','#c4542f','leaf'],
  ['#3e5a3c','#efe0c2','#d98a4a','flower'],
  ['#efe0c2','#2f5f75','#c4542f','wave']

const YOGA_C=[-20,30];
const mats=[];
SARONGS.forEach((s,i)=>{
  const x=YOGA_C[0]+(i-2)*2.3 + (i%2)*.3, z=YOGA_C[1]+(i%2)*1.4;
  const geo=new T.PlaneGeometry(1.5,3,6,12); geo.rotateX(-Math.PI/2);
  const m=new T.Mesh(geo, new T.MeshStandardMaterial({map:SARONG_TEX[i%2], roughness:.95, side:T.DoubleSide}));
  m.rotation.y=(Math.random()-.5)*.25 + Math.PI;
  // drape over the sand surface
  const p=geo.attributes.position; for(let k=0;k<p.count;k++){ p.setY(k, 0.01*Math.sin(k*1.7)); } geo.computeVertexNormals();
  m.material.polygonOffset=true; m.material.polygonOffsetFactor=-2; m.material.polygonOffsetUnits=-2;
  m.position.set(x, MEDI_PAD.y+.05, z); m.receiveShadow=true; m.renderOrder=1; scene.add(m); mats.push(m);
});

  const f=new T.Mesh(new T.SphereGeometry(.05,6,4), new T.MeshBasicMaterial({color:'#ffcf7a'})); f.position.set(x,sandY(x,z)+.27,z); f.userData.flame=true; scene.add(f); }

/* ---------- people ---------- */
function person(o){
  const root=new T.Group(); const fig=new T.Group(); root.add(fig);
  const skin=mat(o.skin), shorts=mat(o.shorts), top=mat(o.top), hair=mat(o.hair);
  const soft=(c)=>new T.MeshStandardMaterial({color:c, roughness:.7});
  const skinS=soft(o.skin), hairS=soft(o.hair);
  let dotM=null;
  if(o.bikini){ const dc=document.createElement('canvas'); dc.width=dc.height=128; const dg=dc.getContext('2d'); dg.fillStyle='#ff8fbf'; dg.fillRect(0,0,128,128); dg.fillStyle='#ffffff';
    for(let y=0;y<4;y++) for(let x=0;x<4;x++){ dg.beginPath(); dg.arc(x*32+16+(y%2)*16, y*32+16, 6, 0, Math.PI*2); dg.fill(); }
    const dt=new T.CanvasTexture(dc); dt.encoding=T.sRGBEncoding; dt.wrapS=dt.wrapT=T.RepeatWrapping; dt.repeat.set(4,2);
    dotM=new T.MeshStandardMaterial({map:dt, roughness:.6}); }
  const hip=new T.Group(); hip.position.y=0.5; fig.add(hip);
  const legGeo=new T.CylinderGeometry(.08,.09,.42,10); legGeo.translate(0,-.21,0);
  const legL=new T.Mesh(legGeo,skinS), legR=new T.Mesh(legGeo,skinS); legL.position.x=-.1; legR.position.x=.1; hip.add(legL,legR);
  [legL,legR].forEach(l=>{ const foot=new T.Mesh(new T.SphereGeometry(.09,10,8), skinS); foot.scale.set(1,.6,1.4); foot.position.set(0,-.42,.04); l.add(foot); });
  const sh=new T.Mesh(new T.SphereGeometry(o.bikini?.235:.24,14,10), o.bikini? dotM : soft(o.shorts)); sh.scale.set(1,.55,.85); sh.position.y=0; hip.add(sh); if(o.bikini) sh.userData.set='bikini';
  const torso=new T.Mesh(new T.SphereGeometry(.24,14,12), o.bikini? skinS : soft(o.top)); torso.scale.set(1,1.05,.85); torso.position.y=.2; hip.add(torso);
  if(o.bikini){
    // smooth bandeau top with a small bow at the front
    const bandTex=dotM.map.clone(); bandTex.needsUpdate=true; bandTex.repeat.set(6,6);
    const bandM=new T.MeshStandardMaterial({map:bandTex, roughness:.6});
    const band=new T.Mesh(new T.SphereGeometry(.252,32,10,0,Math.PI*2,Math.PI*.31,Math.PI*.19), bandM); band.scale.set(1,1.05,.86); band.position.y=.2; hip.add(band); band.userData.set='bikini';
    const bowM=new T.MeshStandardMaterial({color:'#ff6fa8', roughness:.5});
    [-1,1].forEach(s=>{ const loop=new T.Mesh(new T.SphereGeometry(.04,20,14), bowM); loop.scale.set(1.25,.8,.45); loop.position.set(s*.042,.27,.214); loop.rotation.z=s*.35; hip.add(loop); loop.userData.set='bikini'; });
    const knot=new T.Mesh(new T.SphereGeometry(.021,16,12), bowM); knot.position.set(0,.27,.224); hip.add(knot); knot.userData.set='bikini';

function playChop(){
  if(!sharedCtx) return; const ctx=sharedCtx, t0=ctx.currentTime;
  const len=Math.floor(ctx.sampleRate*.09), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=ctx.createBufferSource(); src.buffer=buf; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1700; bp.Q.value=.8;
  const g=ctx.createGain(); g.gain.value=.5; src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t0);
  const o=ctx.createOscillator(); o.frequency.setValueAtTime(170,t0); o.frequency.exponentialRampToValueAtTime(70,t0+.12); const og=ctx.createGain(); og.gain.setValueAtTime(.35,t0); og.gain.exponentialRampToValueAtTime(.001,t0+.15); o.connect(og); og.connect(ctx.destination); o.start(t0); o.stop(t0+.2);
}

function updateCoconut(dt,t,moving){
  const pos=me.root.position, k=t-coco.t0;
  const busy = coco.phase==='pick'||coco.phase==='chop'||coco.phase==='serve';
  const show = Math.hypot(pos.x-COUNTER.x, pos.z-COUNTER.z)<3.4 && !busy && !coco.drinking;
  if(orderBtn.hidden===show) orderBtn.hidden=!show;
  if(!coco.drinking && Math.hypot(pos.x-COUNTER.x,pos.z-COUNTER.z)<4.5) camAuto=Math.PI-0.3;
  const label = coco.phase==='served' ? '하나 더 주문하기 ↗' : '코코넛 주문하기 ↗';
  if(orderBtn.textContent!==label) orderBtn.textContent=label;
  staff.hip.position.y=.5+Math.sin(t*1.6)*.01;
  if(coco.phase==='pick'){
    const u=Math.min(1,k/1.0); workCoco.position.copy(arc(PILE_TOP,CHOP_AT,u,.35));
    staff.armL.rotation.x=-1.3*Math.sin(u*Math.PI); staff.root.rotation.y=Math.PI-.6*Math.sin(u*Math.PI);
    if(u>=1){ coco.phase='chop'; coco.t0=t; }
  } else if(coco.phase==='chop'){
    const per=.7, c=Math.floor(k/per), f=(k%per)/per; let a;
    if(c<3){ if(f<.6) a=-.4-(f/.6)*2.3; else if(f<.78) a=-2.7+((f-.6)/.18)*2.0; else a=-.7;
      if(f>=.78 && coco.chops===c){ coco.chops++; playChop();
        const wp=workCoco.getWorldPosition(new T.Vector3());
        for(let i=0;i<5;i++){ const sp=spray[sprayI++%spray.length]; sp.visible=true; sp.userData.life=.45; sp.position.copy(wp).add(new T.Vector3(0,.2,0)); sp.userData.v.set((Math.random()-.5)*2,1.5+Math.random(),(Math.random()-.5)*2); }
        if(coco.chops===3){ workCoco.userData.setCut(true); workCoco.userData.cap.visible=true; coco.capFly=.001; }
      }
    } else a=-.3;
    staff.armR.rotation.x=a;
    if(k>per*3+.5){ coco.phase='serve'; coco.t0=t; staff.armR.rotation.x=-.3; }
  } else if(coco.phase==='serve'){
    const u=Math.min(1,k/1.1); workCoco.position.copy(arc(CHOP_AT,TABLE_AT,u,.7)); staff.armL.rotation.x=-1.4*Math.sin(Math.min(1,u*2)*Math.PI*.5);
    if(u>=1){ coco.phase='served'; staff.armL.rotation.x=0; capEl.textContent='다 됐어요! 테이블에 올려 드렸어요. 의자에 앉아서 마셔요.'; curCaption='served'; goTo(STOOL.x, STOOL.z); }
  }
  if(coco.capFly>0){ coco.capFly+=dt; const cap=workCoco.userData.cap; cap.position.set(coco.capFly*.6, coco.capFly*1.6-coco.capFly*coco.capFly*3, 0); cap.rotation.z=coco.capFly*6; if(coco.capFly>.7){ cap.visible=false; coco.capFly=0; } }
  // face the counter while the order is being made
  if(busy && !moving && Math.hypot(pos.x-COUNTER.x,pos.z-COUNTER.z)<4){ const want=Math.atan2(COUNTER.x-pos.x, (SHOP.z-1)-pos.z); let d=want-me.root.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); me.root.rotation.y+=d*Math.min(1,dt*5); }
  workCoco.visible = coco.phase!=='none' ? !coco.drinking : true;
  if(!coco.drinking && curCaption==='drink'){ capEl.textContent='잘 마셨어요. 코코넛은 테이블에 두고 가요.'; curCaption='done'; }
}

let audio=null, sharedCtx=null;
function getCtx(){ if(!sharedCtx) sharedCtx=new (window.AudioContext||window.webkitAudioContext)(); return sharedCtx; }
const soundBtn=document.getElementById('soundBtn');
function startSound(){
  if(audio){ if(audio.ctx.state==='suspended') audio.ctx.resume(); audio.master.gain.setTargetAtTime(.55, audio.ctx.currentTime, .4); audio.on=true; soundBtn.textContent='♬ 파도 소리 끄기'; return; }
  try{
    const ctx=getCtx(); if(ctx.state==='suspended') ctx.resume();
    const len=ctx.sampleRate*4, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
    const swell=ctx.createGain(); swell.gain.value=.5;
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.11; const lfoG=ctx.createGain(); lfoG.gain.value=.42; lfo.connect(lfoG); lfoG.connect(swell.gain);
    const lfo2=ctx.createOscillator(); lfo2.frequency.value=0.11; const lfo2G=ctx.createGain(); lfo2G.gain.value=380; lfo2.connect(lfo2G); lfo2G.connect(lp.frequency);
    const master=ctx.createGain(); master.gain.value=0;
    src.connect(lp); lp.connect(swell); swell.connect(master); master.connect(ctx.destination);
    src.start(); lfo.start(); lfo2.start();
    master.gain.setTargetAtTime(music&&music.on?.3:.55, ctx.currentTime, .6);
    audio={ctx,master,on:true}; soundBtn.textContent='♬ 파도 소리 끄기';
  }catch(_){ soundBtn.textContent='소리를 재생할 수 없어요'; }
}

/* ---------- meditation music (synthesized: drone + singing bowl + soft chimes) ---------- */
let music=null;
const musicBtn=document.getElementById('musicBtn');
const BOWL=[293.66,220,329.63,246.94], CHIME=[587.33,659.25,739.99,880,987.77,1174.66];
function tone(freqs, gains, decay, level){
  const ctx=music.ctx, t0=ctx.currentTime;
  freqs.forEach((f,i)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; const g=ctx.createGain();
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(level*gains[i], t0+.03); g.gain.exponentialRampToValueAtTime(.0001, t0+decay*(1-i*.15));
    o.connect(g); g.connect(music.dry); o.start(t0); o.stop(t0+decay+.2); });
}
function scheduleBowl(){ if(!music||!music.on) return; const f=BOWL[Math.floor(Math.random()*BOWL.length)]; tone([f,f*2.71,f*5.18,f*1.004],[1,.35,.12,.6],9,.13); music.tb=setTimeout(scheduleBowl, 9000+Math.random()*7000); }
function scheduleChime(){ if(!music||!music.on) return; const f=CHIME[Math.floor(Math.random()*CHIME.length)]; tone([f,f*2],[1,.15],3.2,.035); music.tc=setTimeout(scheduleChime, 1800+Math.random()*3800); }
function startMusic(){
  try{
    const ctx=getCtx(); if(ctx.state==='suspended') ctx.resume();
    if(!music){
      const out=ctx.createGain(); out.gain.value=0; out.connect(ctx.destination);
      const delay=ctx.createDelay(1.5); delay.delayTime.value=.42; const fb=ctx.createGain(); fb.gain.value=.45; const wet=ctx.createGain(); wet.gain.value=.5;
      delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(out);
      const dry=ctx.createGain(); dry.connect(out); dry.connect(delay);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; const dg=ctx.createGain(); dg.gain.value=.05; lp.connect(dg); dg.connect(out);
      [73.42,110,146.83,220.5].forEach((f,i)=>{ const o=ctx.createOscillator(); o.type=i%2?'sine':'triangle'; o.frequency.value=f; o.detune.value=(i-1.5)*4; const g=ctx.createGain(); g.gain.value=[.5,.35,.25,.12][i]; o.connect(g); g.connect(lp); o.start(); });
      const lfo=ctx.createOscillator(); lfo.frequency.value=.05; const lg=ctx.createGain(); lg.gain.value=.025; lfo.connect(lg); lg.connect(dg.gain); lfo.start();
      music={ctx,out,dry,on:false};
    }
    clearTimeout(music.tb); clearTimeout(music.tc);
    music.on=true; music.out.gain.setTargetAtTime(.9, ctx.currentTime, 1.5);
    scheduleBowl(); setTimeout(scheduleChime, 2500);
    musicBtn.textContent='☾ 명상 음악 끄기';
    if(audio && audio.on) audio.master.gain.setTargetAtTime(.3, ctx.currentTime, 1);
  }catch(_){ musicBtn.textContent='음악을 재생할 수 없어요'; }
}
function stopMusic(){ if(!music) return; music.on=false; clearTimeout(music.tb); clearTimeout(music.tc);
  music.out.gain.setTargetAtTime(0, music.ctx.currentTime, .8); musicBtn.textContent='☾ 명상 음악 켜기';
  if(audio && audio.on) audio.master.gain.setTargetAtTime(.55, audio.ctx.currentTime, 1); }
musicBtn.addEventListener('click',()=>{ musicAuto=false; (music&&music.on) ? stopMusic() : startMusic(); });

    } else {
      const x=u.x+Math.sin(t*.2+u.phase)*.6, z=u.z;
      c.root.position.set(x, waveH(x,z,t)+.05, z); c.root.rotation.y=Math.PI+Math.sin(t*.3+u.phase)*.6; c.root.rotation.z=Math.sin(t*1.1+u.phase)*.06;
    }
  });
  buoy.position.set(6, waveH(6,-30,t)+.2, -30); buoy.rotation.z=Math.sin(t*1.2)*.12;
  kites.forEach(k=>{ const u=k.userData; k.position.set(u.x+Math.sin(t*.4+u.ph)*1.5, u.y+Math.sin(t*.9+u.ph)*.8, u.z); k.rotation.z=Math.sin(t*.7+u.ph)*.25; k.lookAt(camera.position.x, k.position.y, camera.position.z); k.rotation.z+=Math.sin(t*.7+u.ph)*.25; });

  // camera
  const d=9, h=d*Math.sin(camPitch)+1.4, r=d*Math.cos(camPitch);
  const want=new T.Vector3(pos.x+Math.sin(camYaw)*r, pos.y+h, pos.z+Math.cos(camYaw)*r);
  if(!entered){ want.set(Math.sin(t*.05)*6, 9, 52); }
  camPos.lerp(want, Math.min(1, dt*(entered?4:1)));
  camera.position.copy(camPos);
  camera.lookAt(entered? pos.x : 0, (entered? pos.y : 0)+1.3, entered? pos.z : 10);

  sunLight.position.set(pos.x+P.sunPos[0]*.15, 40, pos.z+30); sunLight.target.position.copy(pos);
  updateZone();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>
